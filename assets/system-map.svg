<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Petproject Jarvis System Map</title>
  <desc id="desc">A layered diagram showing public ingestion, private cognition, thin interface, and Gas City work graph archive.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#263238"/>
    </marker>
    <style>
      .bg { fill: #f7f8fa; }
      .panel { fill: #ffffff; stroke: #c8d0d8; stroke-width: 2; rx: 8; }
      .title { font: 700 30px Arial, sans-serif; fill: #17212b; }
      .subtitle { font: 16px Arial, sans-serif; fill: #52616f; }
      .label { font: 700 20px Arial, sans-serif; fill: #17212b; }
      .body { font: 15px Arial, sans-serif; fill: #364653; }
      .small { font: 13px Arial, sans-serif; fill: #52616f; }
      .arrow { stroke: #263238; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #697a89; stroke-width: 2; stroke-dasharray: 7 7; fill: none; marker-end: url(#arrow); }
      .public { fill: #e8f3ff; }
      .private { fill: #f1edf9; }
      .interface { fill: #eaf7ef; }
      .archive { fill: #fff5df; }
      .sample { fill: #f3f6f8; stroke: #d2dae2; stroke-width: 1.5; rx: 6; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="760"/>
  <text class="title" x="64" y="70">Petproject Jarvis Atlas</text>
  <text class="subtitle" x="64" y="100">Public documentation for a private multi-repo automation workspace</text>

  <rect class="panel public" x="70" y="155" width="300" height="180"/>
  <text class="label" x="100" y="200">Work + School Automation</text>
  <text class="body" x="100" y="236">Public ingestion edge</text>
  <text class="small" x="100" y="270">ICS filtering</text>
  <text class="small" x="100" y="296">Schedule parsing</text>
  <text class="small" x="100" y="322">GitHub Actions publication</text>

  <rect class="panel private" x="490" y="145" width="315" height="205"/>
  <text class="label" x="520" y="190">Landon Logs</text>
  <text class="body" x="520" y="226">Private cognition and policy</text>
  <text class="small" x="520" y="260">MCP server</text>
  <text class="small" x="520" y="286">Worker reports</text>
  <text class="small" x="520" y="312">Agent-owned calendar state</text>
  <text class="small" x="520" y="338">Approval boundaries</text>

  <rect class="panel interface" x="925" y="155" width="285" height="180"/>
  <text class="label" x="955" y="200">Jarvis Interface</text>
  <text class="body" x="955" y="236">Thin PWA control plane</text>
  <text class="small" x="955" y="270">Today dashboard</text>
  <text class="small" x="955" y="296">Chat and approvals</text>
  <text class="small" x="955" y="322">Local API adapters</text>

  <rect class="panel archive" x="410" y="455" width="460" height="160"/>
  <text class="label" x="440" y="500">Gas City JSONL Archive</text>
  <text class="body" x="440" y="536">Append-friendly work graph metadata</text>
  <text class="small" x="440" y="570">Issues, comments, dependencies, labels, config, metadata</text>

  <path class="arrow" d="M370 245 C420 245, 435 245, 490 245"/>
  <text class="small" x="392" y="228">clean feeds</text>

  <path class="arrow" d="M805 245 C855 245, 875 245, 925 245"/>
  <text class="small" x="828" y="228">dashboard state</text>

  <path class="arrow" d="M925 305 C865 385, 765 390, 705 350"/>
  <text class="small" x="798" y="382">intent records</text>

  <path class="dash" d="M220 335 C260 430, 340 505, 410 535"/>
  <path class="dash" d="M640 350 L640 455"/>
  <path class="dash" d="M1068 335 C1030 430, 945 505, 870 535"/>

  <rect class="sample" x="70" y="650" width="220" height="48"/>
  <text class="small" x="95" y="680">Synthetic calendar samples</text>
  <rect class="sample" x="330" y="650" width="220" height="48"/>
  <text class="small" x="355" y="680">Synthetic daily startup</text>
  <rect class="sample" x="590" y="650" width="220" height="48"/>
  <text class="small" x="615" y="680">Synthetic dashboard API</text>
  <rect class="sample" x="850" y="650" width="220" height="48"/>
  <text class="small" x="875" y="680">Synthetic work graph</text>
</svg>

